---
name: pgBackRest tests

# yamllint disable-line rule:truthy
on:
  pull_request:
    paths:
      - timescaledb/**
      - tests/pgbackrest/**
      - .github/workflows/pgbackrest-tests.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the add-on image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: timescaledb
          load: true
          tags: addon-under-test
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          build-args: |
            BUILD_ARCH=amd64
            BUILD_FROM=ghcr.io/hassio-addons/base/amd64:21.0.10
      - name: Run the tests
        env:
          IMAGE: addon-under-test
          # The published add-on, without the feature: what "off" has to behave like
          UPSTREAM_IMAGE: ghcr.io/expaso/timescaledb/amd64:edge
        run: tests/pgbackrest/run.sh
