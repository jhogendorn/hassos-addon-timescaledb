---
name: Dogfood publish

# The version in config.yaml is the tag, so the app linter of upstream's CI (which wants "dev")
# does not run here: it runs on feat/pgbackrest, which is what a pull request would be.
# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*-pgbr.*"

permissions: {}

jobs:
  publish:
    name: Build & push ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        architecture: [amd64, aarch64]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the add-on version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version: *//p' timescaledb/config.yaml)"
          if [[ "${TAG#v}" != "${version}" ]]; then
            echo "::error ::tag ${TAG} does not match config.yaml version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compose build flags
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          echo "DATE=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"
          echo "FROM=$(yq --no-colors eval ".build_from.${ARCHITECTURE}" timescaledb/build.yaml)" >> "$GITHUB_ENV"
          if [[ "${ARCHITECTURE}" = "amd64" ]]; then
            echo "PLATFORM=linux/amd64" >> "$GITHUB_ENV"
          else
            echo "PLATFORM=linux/arm64/v8" >> "$GITHUB_ENV"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          outputs: type=image,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          tags: ghcr.io/${{ github.repository_owner }}/timescaledb/${{ matrix.architecture }}:${{ env.VERSION }}
          # The Dockerfile names upstream as the source; GHCR links the package to the repo that pushes it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          context: timescaledb
          file: timescaledb/Dockerfile
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
          platforms: ${{ env.PLATFORM }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ env.DATE }}
            BUILD_FROM=${{ env.FROM }}
            BUILD_NAME=TimescaleDB (pgBackRest)
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ env.VERSION }}
