---
name: TimescaleDB (pgBackRest)
version: 6.1.1-pgbr.1
slug: timescaledb
description: "An open-source database built on PostgreSQL for
  analyzing time-series data with the power and convenience of SQL"
url: https://github.com/expaso/hassos-addon-timescaledb
arch:
  - aarch64
  - amd64
startup: system
init: false
tmpfs: true
map:
  - share:rw
  - backup:rw
  - media:rw
  - addon_config:rw
timeout: 60
backup_pre: /usr/share/timescaledb/backup_pre.sh
backup_post: /usr/share/timescaledb/backup_post.sh
backup_exclude:
  - data/postgres/**
  - postgres/**
  - pgbackrest/credentials.conf
  - pgbackrest/spool/**
ports:
  5432/tcp:
ports_description:
  5432/tcp: "PostgreSQL Port. Enter only the port number, e.g. 5432.
    Beware! This port may already be in use.
    Choose another port-number if the add-on won't start."
options:
  databases:
    - homeassistant
  timescale_enabled:
    - homeassistant
  timescaledb:
    telemetry: basic
    maxmemory: 512MB
    maxcpus: 4
  max_connections: 50
  vectorchord: false
  system_packages: []
  init_commands: []
  retry_upgrade: false
  postgresql_settings: []
  pg_hba_config: []
  pgbackrest:
    enabled: false
schema:
  pgbackrest:
    enabled: bool
    stanza: "match(^[A-Za-z0-9_-]+$)?"
    repo_type: "list(s3|posix)?"
    repo_path: "match(^/[^\\s]*$)?"
    s3_endpoint: "match(^[^\\s/]+$)?"
    s3_bucket: "match(^[A-Za-z0-9._-]+$)?"
    s3_region: "match(^[A-Za-z0-9-]+$)?"
    s3_uri_style: "list(host|path)?"
    s3_verify_tls: bool?
    s3_key: password?
    s3_key_secret: password?
    cipher_pass: password?
    retention_full: int(1,)?
    full_day: "list(mon|tue|wed|thu|fri|sat|sun)?"
    backup_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)?"
    block_incremental: bool?
    archive_queue_max: "match(^[0-9]+(B|KiB|MiB|GiB|TiB)$)?"
    restore_from_repo: bool?
    metrics_push_url: url?
    metrics_labels:
      - "match(^[a-z_][a-z0-9_]*=[^,\"\\s]*$)?"
  postgres_password: password?
  databases:
    - str
  timescale_enabled:
    - str
  timescaledb:
    telemetry: list(off|basic)
    maxmemory: str?
    maxcpus: int(1,)?
  max_connections: int(20,)
  vectorchord: bool
  system_packages:
    - str
  init_commands:
    - str
  retry_upgrade: bool?
  postgresql_settings:
    - match(^[A-Za-z][A-Za-z0-9_.]*\s*=.+$)
  pg_hba_config:
    - type: list(local|host|hostssl|hostnossl)?
      database: str?
      user: str?
      address: str?
      method: list(trust|reject|md5|password|scram-sha-256|gss|sspi|ident|peer|pam|ldap|radius|cert)?
      options: str?
image: ghcr.io/jhogendorn/timescaledb/{arch}
